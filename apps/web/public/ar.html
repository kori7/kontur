<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КОНТУР · AR-стенд</title>
<style>@font-face{font-family:Geologica;src:url('/fonts/Geologica-Regular.woff2') format('woff2');font-weight:400;font-display:swap}body{margin:0;font-family:Geologica,Arial,sans-serif;color:#fff;background:#000D24;overflow:hidden}.ar-brand{position:fixed;inset:12px 12px auto;z-index:21;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:#fff;color:#063E61;border-radius:16px;font-size:14px;line-height:1.5}.ar-brand img{width:68px;height:30px;object-fit:contain;flex-shrink:0}#notice{position:fixed;inset:82px 12px auto;z-index:20;background:#063E61;border:1px solid #135AA6;border-radius:16px;padding:12px 16px;font-size:16px;line-height:1.7}#detail{position:fixed;bottom:14px;left:14px;right:14px;z-index:20;background:#fff;color:#313132;padding:12px 16px;border-radius:16px;font-size:16px;display:none}#open-camera{margin-top:12px;border:0;border-radius:16px;background:#fff;color:#135AA6;padding:14px 20px;min-height:56px;font:inherit;cursor:pointer}</style><link rel="stylesheet" href="/brand/support-copy.css"><link rel="icon" type="image/png" href="/brand/kontur-favicon.png"></head><body class="ar-page">
<header class="ar-brand"><img src="/brand/kontur-mark.png" alt="Логотип КОНТУР" width="68" height="30"><span>КОНТУР · AR</span></header>
<div id="notice" class="support-copy">AR-метки привязаны к маркеру Hiro демонстрационного стенда<br><button id="open-camera">Включить AR-камеру</button></div><div id="detail" class="support-copy"></div>
<script>
const notice=document.getElementById('notice');
document.getElementById('open-camera').onclick=async()=>{
 if(!navigator.mediaDevices?.getUserMedia){notice.textContent='Камера требует HTTPS или localhost. Откройте приложение по защищённому адресу';return;}
 notice.textContent='Подключаем камеру…';
 function load(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});}
 try{
  await load('/vendor/aframe.min.js');await load('/vendor/aframe-ar.js');
  let highlights=[];try{highlights=JSON.parse(new URLSearchParams(location.search).get('highlights')||'[]');}catch{}
  const scene=document.createElement('a-scene');scene.setAttribute('embedded','');scene.setAttribute('vr-mode-ui','enabled: false');scene.setAttribute('renderer','antialias: true; alpha: true');scene.setAttribute('arjs','sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: /vendor/camera_para.dat;');
  const marker=document.createElement('a-marker');marker.setAttribute('type','pattern');marker.setAttribute('url','/vendor/patt.hiro');marker.setAttribute('emitevents','true');
  const nodes=[['motor','Электродвигатель',-0.74,-2.26],['guard','Кожух муфты',0.23,-2.07],['bearing','Подшипниковый узел',0.94,-1.95],['seal','Уплотнение',1.14,-1.83],['base','Рама и крепление',-0.22,-1.31],['gauge','Манометр',1.36,-2.7],['inlet','Всасывающая линия',2.17,-1.63],['coupling','Муфта',0.23,-2.07],['impeller','Рабочее колесо (зона корпуса)',1.35,-1.69],['pump','Насосный агрегат (регламент)',.8,-.94]];
  nodes.forEach(([id,label,x,z])=>{const status=highlights.find(item=>item.id===id)?.severity;const entity=document.createElement('a-sphere');entity.setAttribute('position',`${x} .06 ${z}`);entity.setAttribute('radius','.075');entity.setAttribute('color',status==='critical'?'#B42318':status==='warning'?'#8A4B0F':'#135AA6');entity.setAttribute('class','target');entity.addEventListener('click',()=>{const detail=document.getElementById('detail');detail.textContent=label+(status?' · Требуется проверка':' · Узел демонстрационного стенда');const link=document.createElement('a');link.href='/?component='+encodeURIComponent(id);link.target='_top';link.textContent='Открыть цифровую карточку';detail.appendChild(link);detail.style.display='block';if(parent!==window)parent.postMessage({type:'kontur-component',id},location.origin);});marker.appendChild(entity);});
  scene.appendChild(marker);const camera=document.createElement('a-entity');camera.setAttribute('camera','');camera.setAttribute('cursor','rayOrigin: mouse');camera.setAttribute('raycaster','objects: .target');scene.appendChild(camera);
  marker.addEventListener('markerFound',()=>{notice.textContent='Маркер найден · метки стоят на узлах агрегата Н-101 на стенде';});
  marker.addEventListener('markerLost',()=>{notice.textContent='Маркер потерян · наведите камеру на Hiro';document.getElementById('detail').style.display='none';});
  window.addEventListener('camera-error',()=>{notice.textContent='Камера недоступна. Проверьте разрешение и защищённый адрес';});document.body.appendChild(scene);notice.textContent='Наведите камеру на маркер Hiro. Нажмите на метку для названия узла';
 }catch{notice.textContent='Не удалось загрузить AR-модуль. Используйте анализ снимка';}
};
</script></body></html>
